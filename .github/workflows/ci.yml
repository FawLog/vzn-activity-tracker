name: CI and production artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vzn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  lockfile-policy:
    name: Committed lockfile policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a committed npm lockfile
        run: |
          test -s frontend/package-lock.json
          node -e 'const lock = require("./frontend/package-lock.json"); if (lock.lockfileVersion !== 3) throw new Error("Expected npm lockfileVersion 3")'
          git diff --exit-code -- frontend/package-lock.json

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Validate deployment helper syntax
        run: bash -n deploy/root/audit-vps-storage deploy/root/healthcheck.sh deploy/root/install-vzn-activity-tracker deploy/root/manage-vzn-sudoers deploy/root/stage-vzn-artifacts deploy/root/update-vzn-activity-tracker .github/scripts/test-healthcheck-helper .github/scripts/test-update-rollback-helper

      - name: Test automatic deployment gates
        run: python -m unittest discover -s deploy/autodeploy -p 'test_*.py'

      - name: Test public HTTPS retry helper
        run: .github/scripts/test-healthcheck-helper

      - name: Test root-owned artifact staging
        run: .github/scripts/test-staging-helper

      - name: Test update rollback before a new image loads
        run: .github/scripts/test-update-rollback-helper docker-load-failure

      - name: Test update rollback after backend switching begins
        run: .github/scripts/test-update-rollback-helper backend-switch-failure

      - name: Run backend tests and migration checks
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend:
    name: TypeScript, Vitest, and Vite build
    needs: lockfile-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Package production frontend
        working-directory: frontend
        run: |
          tar --create --gzip --file "../vzn-frontend-${GITHUB_SHA}.tar.gz" --directory dist .
          cd ..
          sha256sum "vzn-frontend-${GITHUB_SHA}.tar.gz" > "vzn-frontend-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload unpacked frontend for browser tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload production frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-frontend-${{ github.sha }}
          path: |
            vzn-frontend-${{ github.sha }}.tar.gz
            vzn-frontend-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Playwright full-stack browser tests
    needs: [backend, frontend, lockfile-policy]
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      ALLOWED_HOSTS: localhost,127.0.0.1
      TRUSTED_PROXIES: 127.0.0.1,::1
      SECURE_COOKIES: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --requirement backend/requirements.txt
          npm ci --prefix frontend

      - name: Install Chromium on the external runner
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral browser-test credentials
        working-directory: frontend
        run: |
          password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${password}"
          echo "::add-mask::${session_secret}"
          password_hash="$(E2E_PASSWORD="${password}" PYTHONPATH=../backend python -c 'import os; from app.security import hash_password; print(hash_password(os.environ["E2E_PASSWORD"]))')"
          echo "E2E_ADMIN_PASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "ADMIN_PASSWORD_HASH=${password_hash}" >> "${GITHUB_ENV}"
          echo "SESSION_SECRET=${session_secret}" >> "${GITHUB_ENV}"
          echo "DATABASE_PATH=${RUNNER_TEMP}/vzn-e2e.sqlite3" >> "${GITHUB_ENV}"

      - name: Run browser tests and capture real UI screenshots
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser screenshots, traces, and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Backend image build and smoke test
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build loadable backend image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          provenance: false
          tags: vzn-activity-tracker-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke-test image startup and restart
        run: |
          admin_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_password}"
          echo "::add-mask::${session_secret}"
          password_hash="$(CI_PASSWORD="${admin_password}" PYTHONPATH=backend python -c 'import os; from app.security import hash_password; print(hash_password(os.environ["CI_PASSWORD"]))')"
          env_file="${RUNNER_TEMP}/vzn-container.env"
          {
            echo 'APP_ENV=test'
            echo 'ALLOWED_HOSTS=localhost,127.0.0.1'
            echo 'TRUSTED_PROXIES=127.0.0.1,::1'
            echo 'DATABASE_PATH=/data/vzn.sqlite3'
            echo "SESSION_SECRET=${session_secret}"
            echo "ADMIN_PASSWORD_HASH=${password_hash}"
            echo 'SECURE_COOKIES=0'
          } > "${env_file}"
          sudo install -d -o 10001 -g 10001 -m 0750 "${RUNNER_TEMP}/vzn-data"
          docker run --detach --name vzn-image-smoke \
            --env-file "${env_file}" \
            --volume "${RUNNER_TEMP}/vzn-data:/data" \
            --publish 127.0.0.1:18088:8000 \
            "vzn-activity-tracker-backend:ci-${GITHUB_SHA}"
          trap 'docker rm --force vzn-image-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18088/api/v1/health; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              docker logs vzn-image-smoke
              exit 1
            fi
            sleep 2
          done
          docker restart vzn-image-smoke >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18088/api/v1/health; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              docker logs vzn-image-smoke
              exit 1
            fi
            sleep 2
          done

      - name: Package production backend image
        run: |
          docker image inspect "vzn-activity-tracker-backend:ci-${GITHUB_SHA}" --format '{{.Id}}' > "vzn-backend-${GITHUB_SHA}.image-id"
          docker save "vzn-activity-tracker-backend:ci-${GITHUB_SHA}" | gzip --best > "vzn-backend-${GITHUB_SHA}.tar.gz"
          sha256sum "vzn-backend-${GITHUB_SHA}.tar.gz" > "vzn-backend-${GITHUB_SHA}.tar.gz.sha256"
          printf 'VZN_IMAGE_TAG=ci-%s\nGIT_COMMIT=%s\n' "${GITHUB_SHA}" "${GITHUB_SHA}" > "vzn-backend-${GITHUB_SHA}.manifest"

      - name: Upload production backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-backend-${{ github.sha }}
          path: |
            vzn-backend-${{ github.sha }}.tar.gz
            vzn-backend-${{ github.sha }}.tar.gz.sha256
            vzn-backend-${{ github.sha }}.image-id
            vzn-backend-${{ github.sha }}.manifest
          if-no-files-found: error
          retention-days: 30

  deployment-bundle:
    name: Assemble deployment bundle
    needs: [browser, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package reviewed deployment source
        run: |
          install -d "${RUNNER_TEMP}/vzn-deployment"
          cp --archive compose.yaml backend scripts deploy DEPLOYMENT.md "${RUNNER_TEMP}/vzn-deployment/"
          printf '%s\n' "${GITHUB_SHA}" > "${RUNNER_TEMP}/vzn-deployment/REVISION"
          tar --create --gzip --file "vzn-deployment-${GITHUB_SHA}.tar.gz" \
            --directory "${RUNNER_TEMP}/vzn-deployment" .
          sha256sum "vzn-deployment-${GITHUB_SHA}.tar.gz" > "vzn-deployment-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deployment-${{ github.sha }}
          path: |
            vzn-deployment-${{ github.sha }}.tar.gz
            vzn-deployment-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
