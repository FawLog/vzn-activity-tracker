name: vzn-activity-tracker

services:
  backend:
    image: vzn-activity-tracker-backend:${VZN_IMAGE_TAG:-0.1.0}
    container_name: vzn-activity-tracker-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8088:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
