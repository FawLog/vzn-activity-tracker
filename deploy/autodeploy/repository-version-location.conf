# Owner-reviewed addition to existing VZN HTTPS server only.
location = /_vzn_version_auth {
    internal;
    proxy_pass http://127.0.0.1:8088/api/v1/version;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/v1/repository-version {
    auth_request /_vzn_version_auth;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8092/api/v1/repository-version;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
