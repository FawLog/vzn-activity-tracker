server {
    listen __VZN_PUBLIC_IPV4__:80;
    server_name vzn.fawlog.cc;
    return 301 https://$host$request_uri;
}

server {
    listen __VZN_PUBLIC_IPV4__:443 ssl http2;
    server_name vzn.fawlog.cc;

    ssl_certificate __VZN_CERTIFICATE_FULLCHAIN__;
    ssl_certificate_key __VZN_CERTIFICATE_PRIVATE_KEY__;

    root /srv/vzn-activity-tracker/current/frontend;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
